#
# Lints and unit tests on every push and pull request, then each display
# backend's end-to-end test against a real headless server. Actions are
# pinned to commit SHAs (tag in the trailing comment).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: minimum Rust (1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  servers:
    name: end to end (${{ matrix.server }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: sway
            packages: sway
          - server: xorg
            packages: xserver-xorg-core xserver-xorg-video-dummy
          - server: kwin
            packages: kwin-wayland
          - server: mutter
            packages: mutter dbus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.server }}
      - name: Install ${{ matrix.server }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ${{ matrix.packages }}
      - name: Run the ${{ matrix.server }} end-to-end test
        env:
          SUDO: ${{ matrix.server == 'xorg' && 'sudo' || '' }}
        run: sh scripts/test-servers.sh ${{ matrix.server }}
