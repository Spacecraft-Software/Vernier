#
# Lints, unit tests and supply-chain checks on every push and pull request,
# then each display backend's end-to-end test against a real headless
# server. Actions are pinned to commit SHAs (tag in the trailing comment).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: minimum Rust (1.90)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  supply-chain:
    name: cargo deny, cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny --locked check
      - run: cargo audit

  docs-packaging:
    name: manual, package definitions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install texinfo and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texinfo shellcheck
      - name: Build the manual (Info, HTML) with no warnings
        run: |
          make info html 2>&1 | tee doc-build.log
          # texi2any reports problems as `doc/vernier.texi:LINE: ...'.
          ! grep -E '^doc/[^ ]+\.texi:[0-9]+:' doc-build.log
      - name: Guix crate list matches Cargo.lock
        run: python3 scripts/guix-crates.py --check
      - name: Shell scripts in packaging pass shellcheck
        run: |
          shellcheck -s bash -e SC2034,SC2154,SC2164 packaging/PKGBUILD
          shellcheck -s sh packaging/vernier.install

  servers:
    name: end to end (${{ matrix.server }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: sway
            packages: sway
          - server: xorg
            packages: xserver-xorg-core xserver-xorg-video-dummy
          - server: kwin
            packages: kwin-wayland
          - server: mutter
            packages: mutter dbus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.server }}
      - name: Install ${{ matrix.server }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ${{ matrix.packages }}
      - name: Run the ${{ matrix.server }} end-to-end test
        env:
          SUDO: ${{ matrix.server == 'xorg' && 'sudo' || '' }}
        run: sh scripts/test-servers.sh ${{ matrix.server }}
