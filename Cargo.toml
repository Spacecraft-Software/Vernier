[workspace]
resolver = "3"
members = [
    "crates/vnr-core",
    "crates/vnr-wlr",
    "crates/vnr-kde",
    "crates/vnr-mutter",
    "crates/vnr-x11",
    "crates/vnr-theme",
    "crates/vnr-config",
    "crates/vnr-backends",
    "crates/vnr-gui",
    "crates/vnr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
authors = ["Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"]
repository = "https://github.com/Spacecraft-Software/Vernier"
homepage = "https://Vernier.SpacecraftSoftware.org/"
readme = "README.md"
keywords = ["wayland", "x11", "display", "randr", "monitor"]
categories = ["gui", "command-line-utilities", "os::linux-apis"]

[workspace.dependencies]
vnr-core = { path = "crates/vnr-core", version = "0.1.0" }
vnr-wlr = { path = "crates/vnr-wlr", version = "0.1.0" }
vnr-kde = { path = "crates/vnr-kde", version = "0.1.0" }
vnr-mutter = { path = "crates/vnr-mutter", version = "0.1.0" }
vnr-x11 = { path = "crates/vnr-x11", version = "0.1.0" }
vnr-backends = { path = "crates/vnr-backends", version = "0.1.0" }
vnr-gui = { path = "crates/vnr-gui", version = "0.1.0" }
vnr-theme = { path = "crates/vnr-theme", version = "0.1.0" }
vnr-config = { path = "crates/vnr-config", version = "0.1.0" }

anyhow = "1.0.104"
csv = "1.4.0"
jiff = "0.2.38"
schemars = "1.2.3"
serde_norway = "0.9.42"
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
nickel-lang-core = { version = "0.19.0", default-features = false }
iced = { version = "0.14.0", features = ["canvas", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
zbus = "5.19.0"
x11rb = { version = "0.13.2", default-features = false, features = ["randr"] }
toml = "1.1.8"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-scanner = "0.31"

# Test-only.
assert_cmd = "2.2.2"
jsonschema = { version = "0.59.0", default-features = false }
predicates = "3.1.4"
tempfile = "3.27.0"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

literal_string_with_formatting_args = "allow"
# iced and wayland-rs pull in several versions of the same transitive
# crates (bitflags, windows-sys, ...). We cannot fix that from here.
multiple_crate_versions = "allow"

# Build flags (Steelbore Standard §3.2 / §3.2.1). Every flag is listed with
# its state so a failing build can be traced to a flag:
#   APPLIED  lto = true          whole-program optimization; Rust LTO runs
#                                inside rustc, so the NixOS GCC-plugin caveat
#                                (§3.2.1) does not apply.
#   APPLIED  codegen-units = 1   enables cross-unit inlining with LTO.
#   APPLIED  panic = "abort"     panics mean "stop" (M-PANIC-IS-STOP).
#   DISABLED target-cpu=native   packages built by Nix/Guix/AUR must run on
#                                any x86-64 machine; opt in locally with
#                                RUSTFLAGS="-C target-cpu=native".
#   DISABLED PGO                 no reliable profile workload yet; a GUI that
#                                spends its time idle gains little.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
